[plugin]
id = "steam-game-name-zh"
name = "Steam 游戏名中文化"
version = "1.0.0-rc.1"
author = "SteamGameName contributors"
description = "按 AppID 为 Steam 游戏库左侧列表显示简体中文或双语名称，并支持中文、Steam 原名和 AppID 搜索。"

[assets]
resources = ["data/translations.zh-CN.json"]

[backend]
entry = "backend/main.lua"
sources = ["backend/**/*.lua"]

[frontend]
entry = "frontend/index.tsx"

[compiler]
output_path = ".millennium/dist/steam-game-name-zh.star"

[dev]
auto_restart = true
reload_steamui_when = "both"

[inspect]
depth = 4
colors = true
show_hidden = false

[logger]
padding = 0
backend_prefix = "SteamGameName BCK"
frontend_prefix = "SteamGameName FRT"

[patches]
debug = false
